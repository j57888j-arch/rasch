services:
  - type: web
    name: ai-math-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ai_math.main:app --host 0.0.0.0 --port $PORT --app-dir src
    healthCheckPath: /health/ready
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: USE_WEBHOOK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-math-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-math-redis
          property: connectionString
      - key: MIN_CALIBRATION_PARTICIPANTS
        value: "30"
      - key: LOG_LEVEL
        value: INFO

  - type: keyvalue
    name: ai-math-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: ai-math-postgres
    plan: free
    region: frankfurt
    databaseName: aimath
    user: aimath
    postgresMajorVersion: "16"
    ipAllowList: []
