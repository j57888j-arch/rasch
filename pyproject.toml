[project]
name = "ai-math-exam-bot"
version = "0.1.0"
description = "Telegram exam bot with fixed 45-question exams, math checking, Rasch 1PL and XLSX/PDF reports"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
